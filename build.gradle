plugins {
    id 'org.springframework.boot' version '3.5.13' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'com.diffplug.spotless' version '8.4.0' apply false
    id 'com.adarshr.test-logger' version '4.0.0' apply false
    id('io.freefair.lombok') version '9.2.0'
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'com.diffplug.spotless'
    apply plugin: 'io.freefair.lombok'
    apply plugin: 'com.adarshr.test-logger'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        mavenCentral()
    }

    dependencyManagement {
        imports {
            mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2025.0.2'
        }
    }

    tasks.named('test') {
        useJUnitPlatform()
    }

    spotless {
        java {
            googleJavaFormat()
        }
    }

    tasks.named('bootBuildImage') {
        imageName = 'staleread/microchat-${project.name}:latest'
        environment ['BP_HEALTH_CHECKER_ENABLED']= 'true'
        buildpacks = ['urn:cnb:builder:paketo-buildpacks/java', 'docker.io/paketobuildpacks/health-checker:2.13.1']
    }
}
