spring.application.name=core-test
server.port=8003

eureka.client.enabled=false
spring.cloud.config.enabled=false

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

spring.sql.init.mode=never

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=secret

jwt.secret=test-secret-key-for-jwt-at-least-32-characters-long
jwt.expiration=86400000

microchat.moto=Test moto
microchat.queues.assistant-prompts=assistant.prompts
microchat.queues.assistant-replies=assistant.replies
